mixed-port: 7890
allow-lan: false
ipv6: true
mode: rule
log-level: info
bind-address: 127.0.0.1
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true
  store-fake-ip: true
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60
tun:
  # TUN 接管 TCP/UDP 53；strict-route 在支持的平台防多网卡旁路。关闭 TUN 需上级 DNS 接管。
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
proxies:
  # 自定义节点与五种直连出口；链式落地须在 x-myClashRules.customProxies 配置并重新生成。
  - name: 🇨🇳 直连 | 双栈
    type: direct
  - name: 🇨🇳 直连 | IPv4优先
    type: direct
    ip-version: ipv4-prefer
  - name: 🇨🇳 直连 | IPv6优先
    type: direct
    ip-version: ipv6-prefer
  - name: 🇨🇳 直连 | 仅IPv4
    type: direct
    ip-version: ipv4
  - name: 🇨🇳 直连 | 仅IPv6
    type: direct
    ip-version: ipv6
  - name: 内置DNS
    type: dns
